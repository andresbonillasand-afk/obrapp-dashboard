<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBRAPP Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:#0D1117; color:#F0F6FC; }
  .header { background:#161B22; border-bottom:1px solid #30363D; padding:16px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .header h1 { font-size:22px; color:#E8620A; display:flex; align-items:center; gap:8px; }
  .org-selector { display:flex; align-items:center; gap:10px; margin-left:auto; }
  .org-selector label { font-size:14px; color:#8B949E; font-weight:600; }
  .org-selector select { background:#21262D; color:#F0F6FC; border:1px solid #30363D; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; min-width:220px; }
  .org-selector select:focus { outline:none; border-color:#E8620A; }
  .refresh-btn { background:#E8620A; color:#fff; border:none; border-radius:8px; padding:8px 16px; font-size:14px; font-weight:bold; cursor:pointer; }
  .refresh-btn:hover { background:#F97316; }
  .refresh-btn:disabled { opacity:0.5; cursor:wait; }
  .loading-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(13,17,23,0.85); display:flex; align-items:center; justify-content:center; z-index:1000; }
  .loading-overlay .spinner { width:48px; height:48px; border:4px solid #30363D; border-top:4px solid #E8620A; border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
  .container { max-width:1200px; margin:0 auto; padding:24px; }
  .kpi-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:24px; }
  .kpi-card { background:#161B22; border:1px solid #30363D; border-radius:12px; padding:20px; }
  .kpi-card .label { font-size:12px; color:#8B949E; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .kpi-card .value { font-size:32px; font-weight:bold; color:#E8620A; }
  .kpi-card .sub { font-size:13px; color:#8B949E; margin-top:4px; }
  .chart-card { background:#161B22; border:1px solid #30363D; border-radius:12px; padding:24px; margin-bottom:24px; }
  .chart-card h2 { font-size:18px; margin-bottom:16px; }
  .chart-card h2 .sub { font-size:13px; color:#8B949E; font-weight:normal; margin-left:8px; }
  table { width:100%; border-collapse:collapse; }
  th { background:#E8620A; color:#fff; padding:10px 12px; text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; }
  td { padding:10px 12px; border-bottom:1px solid #21262D; font-size:14px; }
  tr:nth-child(even) td { background:#161B22; }
  .empty { text-align:center; padding:48px; color:#8B949E; font-size:16px; }
  .bar-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .bar-row .bar-label { width:120px; font-size:13px; color:#8B949E; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-row .bar-track { flex:1; height:20px; background:#21262D; border-radius:4px; overflow:hidden; }
  .bar-row .bar-fill { height:100%; background:#E8620A; border-radius:4px; transition:width 0.5s ease; }
  .bar-row .bar-val { width:80px; text-align:right; font-size:13px; font-weight:bold; color:#F0F6FC; }
  .status-bar { background:#161B22; border:1px solid #30363D; border-radius:8px; padding:12px 20px; margin-bottom:24px; display:flex; align-items:center; gap:10px; font-size:13px; color:#8B949E; }
  .status-bar .dot { width:8px; height:8px; border-radius:50%; background:#22C55E; }
  .error-box { background:rgba(239,68,68,0.1); border:1px solid #EF4444; border-radius:8px; padding:16px; margin-bottom:24px; color:#EF4444; font-size:14px; }
  .org-badge { background:rgba(232,98,10,0.15); color:#E8620A; padding:4px 12px; border-radius:12px; font-size:13px; font-weight:600; }
  @media(max-width:768px) { .header{flex-direction:column;align-items:flex-start} .org-selector{margin-left:0;width:100%} .org-selector select{flex:1} }
</style>
</head>
<body>

<div class="header">
  <h1>OBRAPP Analytics</h1>
  <span class="org-badge" id="orgBadge" style="display:none"></span>
  <div class="org-selector">
    <label for="orgSelect">Empresa:</label>
    <select id="orgSelect"><option value="">Cargando empresas...</option></select>
    <button class="refresh-btn" id="refreshBtn" onclick="loadData()">Actualizar</button>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <div class="spinner"></div>
</div>

<div class="container">
  <div id="errorBox" class="error-box" style="display:none"></div>
  <div class="status-bar" id="statusBar">
    <div class="dot"></div>
    <span id="statusText">Iniciando...</span>
  </div>
  <div id="content"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, query, orderBy } from 'https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyBo10aLImyYWqtuy__YwgXZqhEkEvLL3cY',
  authDomain: 'obrapp-produccion.firebaseapp.com',
  projectId: 'obrapp-produccion',
  storageBucket: 'obrapp-produccion.firebasestorage.app',
  messagingSenderId: '81286915358',
  appId: '1:81286915358:web:f548cddae8cd9bb2fb150f',
};

const TECH_EMAIL = 'andres.bonilla.sand@gmail.com';
const TECH_PASSWORD = 'ObraApp';

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let selectedOrgId = '';
let organizaciones = [];
let allFaenas = [];

window.loadData = loadData;

async function autenticar() {
  if (auth.currentUser) return true;
  try {
    await signInWithEmailAndPassword(auth, TECH_EMAIL.trim(), TECH_PASSWORD.trim());
    return true;
  } catch (e) {
    showError('Error de autenticacion: ' + e.message);
    return false;
  }
}

async function cargarOrganizaciones() {
  const snap = await getDocs(collection(db, 'organizaciones'));
  organizaciones = [];
  snap.forEach(d => {
    const data = d.data();
    organizaciones.push({ id: d.id, nombre: data.nombre || d.id });
  });
  organizaciones.sort((a, b) => a.nombre.localeCompare(b.nombre));

  const select = document.getElementById('orgSelect');
  select.innerHTML = '<option value="TODAS">Todas las empresas</option>' +
    organizaciones.map(o => `<option value="${o.id}">${o.nombre}</option>`).join('');
  select.onchange = () => { selectedOrgId = select.value; renderData(); };
}

async function cargarFaenas() {
  allFaenas = [];

  if (selectedOrgId === 'TODAS' || !selectedOrgId) {
    const q = query(collection(db, 'faenas'), orderBy('syncedAt', 'desc'));
    const snap = await getDocs(q);
    snap.forEach(d => {
      const data = d.data();
      allFaenas.push({ id: d.id, ...data });
    });
    for (const org of organizaciones) {
      try {
        const orgSnap = await getDocs(collection(db, 'organizaciones', org.id, 'faenas'));
        orgSnap.forEach(d => {
          const data = d.data();
          allFaenas.push({ id: d.id, ...data, organizationId: org.id });
        });
      } catch (e) {}
    }
  } else {
    const orgSnap = await getDocs(collection(db, 'organizaciones', selectedOrgId, 'faenas'));
    orgSnap.forEach(d => {
      const data = d.data();
      allFaenas.push({ id: d.id, ...data, organizationId: selectedOrgId });
    });
    const q = query(collection(db, 'faenas'), orderBy('syncedAt', 'desc'));
    const snap = await getDocs(q);
    snap.forEach(d => {
      const data = d.data();
      if (data.organizationId === selectedOrgId || (!data.organizationId && !selectedOrgId)) {
        allFaenas.push({ id: d.id, ...data });
      }
    });
  }

  const mapa = new Map();
  allFaenas.forEach(f => mapa.set(f.id, f));
  allFaenas = Array.from(mapa.values());
}

function loadData() {
  (async () => {
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('refreshBtn').disabled = true;
    document.getElementById('errorBox').style.display = 'none';

    try {
      const ok = await autenticar();
      if (!ok) { document.getElementById('loadingOverlay').style.display = 'none'; return; }

      if (organizaciones.length === 0) await cargarOrganizaciones();
      await cargarFaenas();
      renderData();
      document.getElementById('statusText').textContent =
        `${allFaenas.length} faenas cargadas - Actualizado ${new Date().toLocaleTimeString('es-CL')}`;
    } catch (e) {
      showError('Error cargando datos: ' + e.message);
    } finally {
      document.getElementById('loadingOverlay').style.display = 'none';
      document.getElementById('refreshBtn').disabled = false;
    }
  })();
}

function renderData() {
  const badge = document.getElementById('orgBadge');
  if (selectedOrgId && selectedOrgId !== 'TODAS') {
    const org = organizaciones.find(o => o.id === selectedOrgId);
    badge.textContent = org ? org.nombre : selectedOrgId;
    badge.style.display = 'inline-block';
  } else {
    badge.style.display = 'none';
  }

  const content = document.getElementById('content');

  if (allFaenas.length === 0) {
    content.innerHTML = '<div class="empty">No hay faenas registradas para esta empresa.</div>';
    return;
  }

  let allCiclos = [];
  let allPannes = [];

  allFaenas.forEach(f => {
    (f.ciclosCompletados || []).forEach(c => allCiclos.push(c));
    (f.panneHistorial || []).forEach(p => allPannes.push(p));
  });

  const totalM3 = allCiclos.reduce((a, c) => a + (c.camionCapacidadM3 || 0), 0);
  const totalVueltas = allCiclos.length;
  const avgViaje = allCiclos.length ? Math.round(allCiclos.reduce((a, c) => a + (c.tiempoViaje_seg || 0), 0) / allCiclos.length / 60) : 0;
  const avgCarga = allCiclos.length ? Math.round(allCiclos.reduce((a, c) => a + (c.tiempoCarga_seg || 0), 0) / allCiclos.length / 60) : 0;
  const opsActivos = new Set(allFaenas.map(f => f.usuario?.rut).filter(Boolean)).size;
  const camionesActivos = new Set(allCiclos.map(c => c.camionNombre).filter(Boolean)).size;
  const excavadorasActivas = new Set(allCiclos.map(c => c.excavadoraNombre).filter(Boolean)).size;

  let html = `
    <div class="kpi-grid">
      <div class="kpi-card"><div class="label">Total m3</div><div class="value">${totalM3.toLocaleString('es-CL')}</div><div class="sub">${totalVueltas} vueltas</div></div>
      <div class="kpi-card"><div class="label">Total Ciclos</div><div class="value">${totalVueltas}</div><div class="sub">${opsActivos} operadores</div></div>
      <div class="kpi-card"><div class="label">T. Viaje prom.</div><div class="value">${avgViaje} min</div><div class="sub">${camionesActivos} camiones</div></div>
      <div class="kpi-card"><div class="label">T. Carguio prom.</div><div class="value">${avgCarga} min</div><div class="sub">${excavadorasActivas} excavadoras</div></div>
    </div>
  `;

  const m3PorMaterial = {};
  allCiclos.forEach(c => { m3PorMaterial[c.material] = (m3PorMaterial[c.material] || 0) + (c.camionCapacidadM3 || 0); });
  const matEntries = Object.entries(m3PorMaterial).sort((a, b) => b[1] - a[1]);
  const maxM3 = matEntries.length ? matEntries[0][1] : 1;

  html += '<div class="chart-card"><h2>Volumen por Material <span class="sub">m3 movidos</span></h2>';
  if (matEntries.length === 0) { html += '<div class="empty">Sin datos</div>'; }
  else {
    matEntries.forEach(([label, val]) => {
      html += `<div class="bar-row"><div class="bar-label" title="${label}">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${(val/maxM3*100).toFixed(1)}%"></div></div><div class="bar-val">${val.toFixed(1)} m3</div></div>`;
    });
  }
  html += '</div>';

  const vueltasPorCamion = {};
  allCiclos.forEach(c => { vueltasPorCamion[c.camionNombre] = (vueltasPorCamion[c.camionNombre] || 0) + 1; });
  const camEntries = Object.entries(vueltasPorCamion).sort((a, b) => b[1] - a[1]);

  html += '<div class="chart-card"><h2>Vueltas por Camion</h2>';
  if (camEntries.length === 0) { html += '<div class="empty">Sin datos</div>'; }
  else {
    html += '<table><thead><tr><th>Camion</th><th>Vueltas</th></tr></thead><tbody>';
    camEntries.forEach(([label, val]) => { html += `<tr><td>${label}</td><td>${val}</td></tr>`; });
    html += '</tbody></table>';
  }
  html += '</div>';

  const porDia = {};
  allCiclos.forEach(c => {
    const fecha = new Date(c.fechaHora).toISOString().split('T')[0];
    if (!porDia[fecha]) porDia[fecha] = { vueltas: 0, m3: 0 };
    porDia[fecha].vueltas++;
    porDia[fecha].m3 += (c.camionCapacidadM3 || 0);
  });
  const diaEntries = Object.entries(porDia).sort((a, b) => a[0].localeCompare(b[0]));

  html += '<div class="chart-card"><h2>Produccion Diaria</h2>';
  if (diaEntries.length === 0) { html += '<div class="empty">Sin datos</div>'; }
  else {
    html += '<table><thead><tr><th>Fecha</th><th>Vueltas</th><th>m3</th></tr></thead><tbody>';
    diaEntries.forEach(([fecha, d]) => { html += `<tr><td>${fecha}</td><td>${d.vueltas}</td><td>${d.m3.toFixed(1)}</td></tr>`; });
    html += '</tbody></table>';
  }
  html += '</div>';

  const opsMap = {};
  allFaenas.forEach(f => {
    const rut = f.usuario?.rut || 'N/A';
    if (!opsMap[rut]) opsMap[rut] = { nombre: f.usuario?.nombre || 'N/A', rut, sector: f.usuario?.sector || 'N/A', m3: 0, vueltas: 0 };
    const ciclos = f.ciclosCompletados || [];
    opsMap[rut].m3 += ciclos.reduce((a, c) => a + (c.camionCapacidadM3 || 0), 0);
    opsMap[rut].vueltas += ciclos.length;
  });
  const opsEntries = Object.values(opsMap).sort((a, b) => b.m3 - a.m3);

  html += '<div class="chart-card"><h2>Produccion por Operador</h2>';
  if (opsEntries.length === 0) { html += '<div class="empty">Sin datos</div>'; }
  else {
    html += '<table><thead><tr><th>Operador</th><th>RUT</th><th>Sector</th><th>Vueltas</th><th>m3</th></tr></thead><tbody>';
    opsEntries.forEach(o => { html += `<tr><td>${o.nombre}</td><td>${o.rut}</td><td>${o.sector}</td><td>${o.vueltas}</td><td>${o.m3.toFixed(1)}</td></tr>`; });
    html += '</tbody></table>';
  }
  html += '</div>';

  if (allPannes.length > 0) {
    html += '<div class="chart-card"><h2 style="color:#EF4444">PANNE (' + allPannes.length + ')</h2>';
    html += '<table><thead><tr><th>Equipo</th><th>Tipo</th><th>Duracion</th></tr></thead><tbody>';
    allPannes.forEach(p => {
      const m = Math.floor((p.duracion_seg || 0) / 60);
      const s = (p.duracion_seg || 0) % 60;
      html += `<tr><td>${p.equipoNombre}</td><td>${p.tipoEquipo}</td><td>${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</td></tr>`;
    });
    html += '</tbody></table></div>';
  }

  content.innerHTML = html;
}

function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.style.display = 'block';
}

loadData();
</script>
</body>
</html>
